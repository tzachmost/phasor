# Phasor's Mango profile. This is passed with `mango -c` and never copied over
# ~/.config/mango/config.conf.

# Acrylic-like panel backgrounds: blur transparent Quickshell layers while
# keeping application surfaces crisp.
blur_layer=1
layer_shadows=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
border_radius=4
no_radius_when_single=1

# Mango tags are surfaced to users as Spaces. The grid layout is the default.
tag_num=9
animation_duration_tag=200
sloppyfocus=0
focus_on_activate=1
# Keep the AORUS CO49DQ at its native maximum mode and full-size UI scale.
monitorrule=model:AORUS CO49DQ,width:5120,height:1440,refresh:144,x:0,y:0,scale:1
tagrule=id:1,layout_name:grid
tagrule=id:2,layout_name:grid
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:grid
tagrule=id:6,layout_name:grid
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:grid
tagrule=id:9,layout_name:grid

# Launcher overlay and session control.
bind=SUPER,SPACE,spawn,phasorctl launcher toggle
bind=SUPER,comma,spawn,phasorctl settings toggle
bind=SUPER,slash,spawn,phasorctl commands toggle
bind=SUPER+SHIFT,V,spawn,phasorctl clipboard toggle
bind=SUPER,B,spawn,xdg-open about:blank
bind=SUPER+CTRL,LEFT,viewtoleft,0
bind=SUPER+CTRL,RIGHT,viewtoright,0
bind=SUPER+SHIFT+CTRL,LEFT,tagtoleft,0
bind=SUPER+SHIFT+CTRL,RIGHT,tagtoright,0

# Direct Space access. Mango tag zero is reserved and omitted.
bind=SUPER+CTRL,1,view,1,0
bind=SUPER+CTRL,2,view,2,0
bind=SUPER+CTRL,3,view,3,0
bind=SUPER+CTRL,4,view,4,0
bind=SUPER+CTRL,5,view,5,0
bind=SUPER+CTRL,6,view,6,0
bind=SUPER+CTRL,7,view,7,0
bind=SUPER+CTRL,8,view,8,0
bind=SUPER+CTRL,9,view,9,0
bind=SUPER+SHIFT+CTRL,1,tag,1,0
bind=SUPER+SHIFT+CTRL,2,tag,2,0
bind=SUPER+SHIFT+CTRL,3,tag,3,0
bind=SUPER+SHIFT+CTRL,4,tag,4,0
bind=SUPER+SHIFT+CTRL,5,tag,5,0
bind=SUPER+SHIFT+CTRL,6,tag,6,0
bind=SUPER+SHIFT+CTRL,7,tag,7,0
bind=SUPER+SHIFT+CTRL,8,tag,8,0
bind=SUPER+SHIFT+CTRL,9,tag,9,0

# Window actions.
bind=SUPER,W,killclient
bind=SUPER,UP,togglemaximizescreen
bind=SUPER,DOWN,minimized
bind=SUPER+SHIFT,SPACE,togglefloating
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglefloating
axisbind=SUPER,DOWN,minimized
axisbind=SUPER,UP,togglemaximizescreen

# Mango starts a small reporter inside its environment so the session
# supervisor can pass MANGO_INSTANCE_SIGNATURE to the core and Quickshell.
exec-once=phasor-session --capture-mango-env
