[project]
name = "phasor-core"
version = "1.1.0.dev0"
description = "Portable service layer for Phasor Shell"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
preview = ["Pillow>=10", "pypdf>=5.7.0", "reportlab>=4", "cryptography>=41", "pyHanko>=0.36.2,<0.38"]
background-removal = ["rembg[cpu]>=2.0.85,<3; python_version < '3.14'"]

[tool.unittest]
start-directory = "tests"
